[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
file_template = %%(rev)s_%%(slug)s
timezone = UTC

# The URL is resolved at runtime from DATABASE_URL in migrations/env.py;
# this value is only a local fallback.
sqlalchemy.url = postgresql+asyncpg://algo:algo@localhost:5432/algo

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
