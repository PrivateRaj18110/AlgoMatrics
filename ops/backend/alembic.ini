# Alembic configuration for the Raj Quant OS backend.
#
# The database URL is NOT hard-coded here — env.py pulls it from the app settings
# (DATABASE_URL), so migrations always target the same database as the running
# backend. Run from the backend/ directory:
#
#   alembic upgrade head        # apply all migrations
#   alembic downgrade -1        # roll back one revision
#   alembic revision --autogenerate -m "msg"

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# Overridden in env.py from app settings; kept as a harmless fallback.
sqlalchemy.url = sqlite:///./raj_dev.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
