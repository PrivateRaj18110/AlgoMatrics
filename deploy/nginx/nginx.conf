events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;
  client_max_body_size 4m;

  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  upstream api_upstream { server api:8000; }
  upstream ops_api_upstream { server ops-api:8000; }

  # gzip for static assets and JSON API responses.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_types text/plain text/css text/xml application/xml application/javascript
             application/json application/manifest+json image/svg+xml
             application/font-woff2;

  server {
    listen 8080;

    # NOTE: nginx drops server-level add_header directives in any location
    # that declares its own add_header, so every such location repeats the
    # full set below. Keep them in sync.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # 'self' covers same-origin ws/wss in evergreen browsers. style-src allows
    # inline styles for chart/library-generated style attributes.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Container-local health endpoint (used by the frontend healthcheck).
    location = /healthz {
      access_log off;
      return 200 "ok\n";
    }

    # WebSocket upgrade for live channels.
    location /api/v1/ws {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 65s;
    }

    # REST API.
    location /api/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_read_timeout 60s;
    }

    # --- Ops dashboard (served under /ops) --------------------------------

    # Ops websocket (raj_monitor live telemetry feed).
    location = /ops/api/ws {
      proxy_pass http://ops_api_upstream/api/ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 65s;
    }

    # Ops REST API (incl. /ops/api/agent/* ingestion from remote machines).
    location /ops/api/ {
      # Telemetry ingest burst sizing. Steady state is ~0.31 envelopes/sec in
      # batches of 200 — roughly one request every 3 seconds per agent
      # (raj_monitor upload_sec=3), so 20r/s is already generous. The larger
      # burst absorbs a queue drain after an outage (a full 100k-envelope
      # backlog is ~500 batches) without shedding real telemetry.
      #
      # Authentication is enforced by the application on every /ops/api/agent/*
      # and /ops/api/ingest/* request; this limit is abuse protection, not
      # access control.
      limit_req zone=api burst=100 nodelay;
      # The agent gzips batches above 512 bytes; 8m is far above any legitimate
      # payload and bounds a malicious one.
      client_max_body_size 8m;
      proxy_pass http://ops_api_upstream/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_read_timeout 60s;
    }

    # Cache-bust the ops app's hashed assets aggressively.
    location /ops/assets/ {
      root /usr/share/nginx/html;
      expires 1y;
      add_header Cache-Control "public, immutable" always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
      try_files $uri =404;
    }

    # Ops UI is retired as a public product. Ingest remains at /ops/api/*.
    # Unauthenticated visitors follow /app/dashboard → /login.
    location = /ops { return 302 /app/dashboard; }
    location /ops/ {
      return 302 /app/dashboard;
    }

    # nginx's bundled mime.types has no entry for .webmanifest.
    location = /site.webmanifest {
      root /usr/share/nginx/html;
      default_type application/manifest+json;
      add_header Cache-Control "public, max-age=86400" always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # Cache-bust hashed assets aggressively.
    location /assets/ {
      root /usr/share/nginx/html;
      expires 1y;
      add_header Cache-Control "public, immutable" always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
      try_files $uri =404;
    }

    # SPA fallback: every other path serves index.html. robots.txt, sitemap.xml,
    # favicon.svg, og.png etc. exist as real files and are matched by $uri first.
    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache" always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
  }
}
