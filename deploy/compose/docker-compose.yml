name: algo-matrics

x-backend-image: &backend-image
  build:
    context: ../..
    dockerfile: deploy/docker/backend.Dockerfile
  image: algo-matrics/backend:local

# Hardened runtime shared by every backend process: read-only root filesystem
# (writes go to the app_var volume and tmpfs), no privilege escalation.
x-backend-env: &backend-env
  env_file: ../../.env
  environment:
    JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private_key
    JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public_key
    BROKER_CREDENTIAL_KEK_FILE: /run/secrets/broker_kek
    # AI-CIO advisory DuckDB, produced by the aicio-pipeline service and mounted
    # read-only below. Only the API (market-intel endpoints) and the trading
    # engine (shadow gate) consume it; other backend services ignore it. Set here
    # (not via .env) because this is the fixed in-container path.
    AICIO_DUCKDB_PATH: /data/aicio.duckdb
    OPS_DATABASE_URL: "${OPS_DATABASE_URL:-}"
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  volumes:
    - secrets:/run/secrets:ro
    - app_var:/app/var
    - aicio_data:/data:ro

services:
  # One-shot: generate JWT keypair + broker KEK into the shared secrets volume.
  secrets-init:
    image: python:3.13-slim
    command:
      - bash
      - -c
      - |
        set -e
        pip install --quiet cryptography
        python - <<'PY'
        import base64, os, secrets
        from pathlib import Path
        from cryptography.hazmat.primitives import serialization
        from cryptography.hazmat.primitives.asymmetric import rsa

        out = Path("/secrets")
        out.mkdir(parents=True, exist_ok=True)
        if not (out / "jwt_private_key").exists():
            key = rsa.generate_private_key(public_exponent=65537, key_size=2048)
            (out / "jwt_private_key").write_bytes(
                key.private_bytes(
                    serialization.Encoding.PEM,
                    serialization.PrivateFormat.PKCS8,
                    serialization.NoEncryption(),
                )
            )
            (out / "jwt_public_key").write_bytes(
                key.public_key().public_bytes(
                    serialization.Encoding.PEM,
                    serialization.PublicFormat.SubjectPublicKeyInfo,
                )
            )
            print("generated JWT keypair")
        if not (out / "broker_kek").exists():
            (out / "broker_kek").write_text(base64.b64encode(secrets.token_bytes(32)).decode())
            print("generated broker KEK")
        print("secrets ready")
        PY
    volumes:
      - secrets:/secrets

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: algo
      POSTGRES_USER: algo
      POSTGRES_PASSWORD: algo
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algo -d algo"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot: run migrations and seed reference data, then exit 0.
  migrate:
    <<: [*backend-image, *backend-env]
    command: ["migrate"]
    depends_on:
      postgres: {condition: service_healthy}
      secrets-init: {condition: service_completed_successfully}
    restart: "no"

  api:
    <<: [*backend-image, *backend-env]
    command: ["api"]
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  worker:
    <<: [*backend-image, *backend-env]
    command: ["worker"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped

  market-data:
    <<: [*backend-image, *backend-env]
    command: ["market-data"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped

  trading-engine:
    <<: [*backend-image, *backend-env]
    command: ["engine"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped

  scheduler:
    <<: [*backend-image, *backend-env]
    command: ["scheduler"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped

  # AI-CIO market-intelligence pipeline: the sole writer of the shared advisory
  # DuckDB (regime/rankings/news/options/flow). Independent of Postgres/Redis and
  # synthetic-by-default, so it needs no network. The API and trading engine mount
  # the same volume read-only. See docs/operations/market-intelligence.md.
  aicio-pipeline:
    build:
      context: ../..
      dockerfile: deploy/docker/aicio.Dockerfile
    image: algo-matrics/aicio:local
    environment:
      AICIO_DB_PATH: /data/aicio.duckdb
      AICIO_DATA_SOURCE: synthetic
      AICIO_REFRESH_SECONDS: "86400"
    volumes:
      - aicio_data:/data
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Ops dashboard backend: raj_monitor telemetry ingest + live platform data
  # proxied from the control plane with a read-scope API key.
  ops-api:
    build:
      context: ../..
      dockerfile: deploy/docker/ops-api.Dockerfile
    image: algo-matrics/ops-api:local
    env_file: ../../.env
    environment:
      # The platform DATABASE_URL must not leak into the ops service. Point this
      # at a database dedicated to ops telemetry; blank keeps the in-memory mock,
      # which is fine for local development but is refused when
      # ENVIRONMENT=production (telemetry would be lost on every restart and
      # deduplication would be disabled).
      #   e.g. postgresql+psycopg://ops:ops@ops-postgres:5432/ops_telemetry
      DATABASE_URL: "${OPS_DATABASE_URL:-}"
      APP_NAME: "AlgoMatrics Ops API"
      ALGOMATRICS_API_URL: http://api:8000/api/v1
      # Ingestion credentials. Required for /api/agent/* and /api/ingest/*, which
      # fail closed when unset — they are never left open. Generate with:
      #   python -c "import secrets; print(secrets.token_urlsafe(32))"
      # Prefer machine-scoped RAJ_AGENT_TOKENS ("machine:token,...") in
      # production; see ops/backend/.env.example.
      RAJ_AGENT_TOKENS: "${RAJ_AGENT_TOKENS:-}"
      RAJ_AGENT_TOKEN: "${RAJ_AGENT_TOKEN:-}"
      # Websocket viewer credential for /api/ws.
      RAJ_DASHBOARD_TOKEN: "${RAJ_DASHBOARD_TOKEN:-}"
      # Production requires REST dashboard auth automatically. Keep this knob
      # for staging/dev parity tests.
      OPS_REST_AUTH_REQUIRED: "${OPS_REST_AUTH_REQUIRED:-false}"
      TELEMETRY_RETENTION_DAYS: "${TELEMETRY_RETENTION_DAYS:-0}"
      OPERATIONAL_EVENT_RETENTION_DAYS: "${OPERATIONAL_EVENT_RETENTION_DAYS:-0}"
      DEAD_LETTER_RETENTION_DAYS: "${DEAD_LETTER_RETENTION_DAYS:-0}"
      SESSION_RETENTION_DAYS: "${SESSION_RETENTION_DAYS:-0}"
      # EOD files are catalogued in the ops database and stored on this volume
      # in local compose by default. Set EOD_STORAGE_BACKEND=s3 and the S3
      # values below before horizontally scaling ops-api.
      EOD_STORAGE_BACKEND: "${EOD_STORAGE_BACKEND:-local}"
      EOD_STORAGE_ROOT: "${EOD_STORAGE_ROOT:-/var/lib/algomatrics/eod}"
      EOD_MAX_CHUNK_BYTES: "${EOD_MAX_CHUNK_BYTES:-26214400}"
      EOD_S3_BUCKET: "${EOD_S3_BUCKET:-}"
      EOD_S3_PREFIX: "${EOD_S3_PREFIX:-algomatrics/eod}"
      EOD_S3_REGION: "${EOD_S3_REGION:-}"
      EOD_S3_ENDPOINT_URL: "${EOD_S3_ENDPOINT_URL:-}"
      EOD_S3_FORCE_PATH_STYLE: "${EOD_S3_FORCE_PATH_STYLE:-false}"
      EOD_S3_SERVER_SIDE_ENCRYPTION: "${EOD_S3_SERVER_SIDE_ENCRYPTION:-}"
      EOD_METADATA_RETENTION_DAYS: "${EOD_METADATA_RETENTION_DAYS:-0}"
      EOD_RAW_RETENTION_DAYS: "${EOD_RAW_RETENTION_DAYS:-0}"
      QUANT_MAX_FILE_BYTES: "${QUANT_MAX_FILE_BYTES:-52428800}"
      QUANT_MAX_ROWS: "${QUANT_MAX_ROWS:-500000}"
      QUANT_REPLAY_MAX_POINTS: "${QUANT_REPLAY_MAX_POINTS:-2000}"
      QUANT_SYNTHETIC_MAX_STEPS: "${QUANT_SYNTHETIC_MAX_STEPS:-10000}"
      QUANT_REPORT_RETENTION_DAYS: "${QUANT_REPORT_RETENTION_DAYS:-0}"
      # ALGOMATRICS_API_KEY + ALGOMATRICS_ORG_ID come from ../../.env (env_file
      # above). With them the ops dashboard (now live by default) shows real
      # platform data; without them the ops-api serves its own mock. See
      # .env.example and docs/operations/ops-dashboard.md.
    depends_on:
      api: {condition: service_started}
    volumes:
      - ops_eod_data:/var/lib/algomatrics/eod
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  frontend:
    build:
      context: ../..
      dockerfile: deploy/docker/frontend.Dockerfile
    image: algo-matrics/frontend:local
    ports: ["8080:8080"]
    depends_on:
      api: {condition: service_started}
      ops-api: {condition: service_started}
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  secrets:
  app_var:
  aicio_data:
  ops_eod_data:
